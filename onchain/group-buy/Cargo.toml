[package]
name = "bundlepad-group-buy"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Atomic group buy on a pump.fun bonding curve, split 1:1 by SOL"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
